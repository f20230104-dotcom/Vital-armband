; =============================================================================
; Vital wristband - PlatformIO project
;
;   pio run -e esp32dev                 build (SIMULATION_MODE = true, no sensors needed)
;   pio run -e esp32dev -t upload       flash
;   pio device monitor                  serial log @115200
;   pio run -e esp32dev-hw              build with real MPU6050 / MAX30102 / DS3231
;   pio run -e esp32dev-logger -t upload  stream raw wrist IMU data for re-training
;   pio test -e native                  host unit tests (DSP, vitals, fall state machine)
;   pio run -e xiao-s3[-hw|-logger]     same builds for the compact pod (Seeed XIAO ESP32-S3,
;                                       no DS3231: time from NTP, see TIME_ZONE in config.h)
; =============================================================================

[platformio]
default_envs = esp32dev

[common]
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
    adafruit/RTClib @ ^2.1.4
    adafruit/Adafruit MPU6050 @ ^2.2.6
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0

[env:esp32dev]
; pinned: Arduino-ESP32 2.0.17 / ESP-IDF 4.4 (stable, matches the TFLite Micro port)
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv      ; 1.9 MB app slots, OTA-capable
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps = ${common.lib_deps}
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DSIMULATION_MODE=true

[env:esp32dev-hw]
extends = env:esp32dev
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DSIMULATION_MODE=false

; Collect real wrist recordings: python ml_training/record_wrist_data.py --port <serial port> ...
[env:esp32dev-logger]
extends = env:esp32dev
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DSIMULATION_MODE=false
    -DDATA_LOGGER_MODE=true

; ---- Compact pod: Seeed XIAO ESP32-S3 (21 x 17.8 mm, built-in LiPo charger) --------------
[env:xiao-s3]
platform = espressif32 @ 6.9.0
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps = ${common.lib_deps}
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_XIAO_S3=true
    -DSIMULATION_MODE=true

[env:xiao-s3-hw]
extends = env:xiao-s3
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_XIAO_S3=true
    -DSIMULATION_MODE=false

[env:xiao-s3-logger]
extends = env:xiao-s3
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_XIAO_S3=true
    -DSIMULATION_MODE=false
    -DDATA_LOGGER_MODE=true

; Host-side unit tests of the hardware-independent modules.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> +<drivers/dsp_filters.cpp> +<drivers/ppg_processor.cpp> +<drivers/fall_detector.cpp>
test_build_src = yes
build_flags = -std=c++17 -Iinclude -DSIMULATION_MODE=true -DUNIT_TEST
