; =============================================================================
; Vital wristband - PlatformIO project
;
;   pio run -e esp32dev                 build (SIMULATION_MODE = true, no sensors needed)
;   pio run -e esp32dev -t upload       flash
;   pio device monitor                  serial log @115200
;   pio run -e esp32dev-hw              build with real MPU6050 / MAX30102 / DS3231
;   pio test -e native                  host unit tests (DSP, vitals, fall state machine)
; =============================================================================

[platformio]
default_envs = esp32dev

[common]
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
    adafruit/RTClib @ ^2.1.4
    adafruit/Adafruit MPU6050 @ ^2.2.6
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0

[env:esp32dev]
; pinned: Arduino-ESP32 2.0.17 / ESP-IDF 4.4 (stable, matches the TFLite Micro port)
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv      ; 1.9 MB app slots, OTA-capable
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps = ${common.lib_deps}
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DSIMULATION_MODE=true

[env:esp32dev-hw]
extends = env:esp32dev
build_flags =
    -std=gnu++17
    -O2
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DSIMULATION_MODE=false

; Host-side unit tests of the hardware-independent modules.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> +<drivers/dsp_filters.cpp> +<drivers/ppg_processor.cpp> +<drivers/fall_detector.cpp>
test_build_src = yes
build_flags = -std=c++17 -Iinclude -DSIMULATION_MODE=true -DUNIT_TEST
